spring:
  application:
    name: orderflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderflow}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

orderflow:
  jwt:
    secret: ${JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
  admin:
    email: ${ADMIN_EMAIL:admin@orderflow.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
