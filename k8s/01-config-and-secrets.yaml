# DEV-ONLY placeholder values. Replace every value below before deploying anywhere but a local
# kind/minikube cluster — none of these are safe defaults for a real environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
  namespace: orderflow
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "orderflow"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  ORDER_SERVICE_HOST: "order-service"
  INVENTORY_SERVICE_HOST: "inventory-service"
  INVENTORY_SERVICE_URL: "http://inventory-service:8082"
  ADMIN_EMAIL: "admin@orderflow.local"
  RATE_LIMIT_CAPACITY: "20"
  RATE_LIMIT_REFILL_PER_SECOND: "10"
  PAYMENT_PROVIDER: "mock"
  NOTIFICATION_PROVIDER: "mock"
  SENDGRID_FROM_ADDRESS: "orders@orderflow.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secrets
  namespace: orderflow
type: Opaque
stringData:
  DB_PASSWORD: "orderflow"
  JWT_SECRET: "ZmFrZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY="
  ADMIN_PASSWORD: "ChangeMe123!"
  # Populated in Phase 4's real-integration pass — leave blank to keep MockPaymentGateway /
  # MockNotificationSender active (see payment-service / notification-service README notes).
  STRIPE_API_KEY: ""
  SENDGRID_API_KEY: ""
