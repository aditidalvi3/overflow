spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: '*'
        spring.json.add.type.headers: false
    producer:
      properties:
        spring.json.add.type.headers: false

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

orderflow:
  notification:
    # mock (default) just logs. Set to "sendgrid" (env NOTIFICATION_PROVIDER=sendgrid) plus a
    # real SENDGRID_API_KEY to send actual email - see SendGridNotificationSender's Javadoc,
    # unverified against a live account.
    provider: ${NOTIFICATION_PROVIDER:mock}
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      from-address: ${SENDGRID_FROM_ADDRESS:orders@orderflow.local}
