spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**,/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCB
                fallbackUri: forward:/fallback/order-service
        - id: inventory-service
          uri: http://${INVENTORY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryServiceCB
                fallbackUri: forward:/fallback/inventory-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

orderflow:
  jwt:
    secret: ${JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:20}
    refill-per-second: ${RATE_LIMIT_REFILL_PER_SECOND:10}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
    instances:
      orderServiceCB:
        base-config: default
      inventoryServiceCB:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      orderServiceCB:
        base-config: default
      inventoryServiceCB:
        base-config: default
